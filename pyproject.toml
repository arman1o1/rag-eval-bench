[project]
name = "rag-eval-bench"
version = "0.1.0"
description = "RAG Pipeline with Evaluation Framework — benchmarks chunking strategies, retrieval methods, and generation quality with hallucination detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "openai>=1.60,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",

    # Document processing
    "pymupdf>=1.25,<2",

    # Embeddings
    "sentence-transformers>=3.0,<4",

    # Vector DB
    "qdrant-client>=1.12,<2",

    # Sparse retrieval
    "rank-bm25>=0.2.2,<0.3",

    # Reranking
    "cohere>=5.0,<6",

    # Evaluation
    "ragas>=0.2,<0.3",
    "datasets>=3.0,<4",

    # Dashboard
    "streamlit>=1.40,<2",
    "plotly>=6.0,<7",

    # Utilities
    "python-dotenv>=1.0,<2",
    "rich>=13.0,<14",
    "tqdm>=4.66,<5",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (Qdrant, APIs)",
]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "src"


